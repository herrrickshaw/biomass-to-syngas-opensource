[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "biomass-to-syngas-opensource"
version = "0.1.0"
description = "Open-source conceptual sizing tools for biomass gasification to syngas (feedstock characterization, gasifier, tar/particulate cleanup, syngas quality screening)"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "CoolProp>=6.6",
    "scipy>=1.11",
    "numpy>=1.24",
    "streamlit>=1.32",
    "pandas>=2.1",
]

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.setuptools.packages.find]
include = ["biomass_to_syngas*"]
